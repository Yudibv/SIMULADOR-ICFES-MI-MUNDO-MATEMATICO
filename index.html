<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador ICFES Saber 11 - Mundo Matemático</title>
  <!-- Ruta exacta apuntando a la carpeta css -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- Cabecera Institucional -->
  <header class="header-principal">
    <div class="logo-contenedor">
      <img src="logo.jpg" alt="Mundo Matemático">
      <h1 class="titulo-sitio">MUNDO MATEMÁTICO <span class="sub-saber">Saber 11</span></h1>
    </div>
    <nav>
      <a href="index.html" class="link-nav">Simulador Oficial</a>
    </nav>
  </header>

  <!-- Contenedor principal donde el menú dibuja las tarjetas -->
  <main id="vista" class="contenedor-principal">
    <div id="rejilla" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;"></div>
    <div id="aviso" class="alerta oculto"></div>
  </main>

  <!-- Pie de página -->
  <footer class="footer-principal">
    <p>Mundo Matemático • Educación y pre-universitario de alto rendimiento</p>
  </footer>

  <!-- Ruta exacta apuntando a la carpeta js -->
  <script type="module" src="js/menu.js"></script>
</body>
</html>
